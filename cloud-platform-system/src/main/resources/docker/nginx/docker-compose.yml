version: '3'

services:
  nginx:
    # image: nginx:stable-alpine  # 轻量稳定版
    image: hub-mirror.c.163.com/library/nginx:stable-alpine
    container_name: nginx-frontend
    restart: always             # 开机自启、崩溃重启
    ports:
      - "8060:80"               # 主机80端口映射到容器80
    volumes:
      # 挂载前端打包文件
      - ./dist:/usr/share/nginx/html
      # 挂载自定义nginx配置
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge